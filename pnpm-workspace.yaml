# RN autolinking only scans the app's own tree, so a deeply nested native dep is never found.
# Not `nodeLinker: hoisted`: it breaks the per-package symlinks `android/settings.gradle` expects
# `publicHoistPattern` only adds root symlinks on top of the isolated layout
publicHoistPattern:
  - '*react-native*'
packages:
  - 'core/*'
  - 'adapters/*'
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  detox: true
  dtrace-provider: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - prettier@3.9.1
  - '@symbiote-native/angular@0.3.3 || 0.5.0'
  - '@symbiote-native/components@0.2.3 || 0.2.5'
  - '@symbiote-native/css-parser@0.2.1 || 0.2.2'
  - '@symbiote-native/engine@0.1.4 || 0.1.6'
  - '@symbiote-native/react@0.2.4 || 0.2.6'
  - '@symbiote-native/slider@2.0.5 || 4.0.0'
  - '@symbiote-native/vue@0.3.3 || 0.3.6'
  - '@symbiote-native/test-utils@0.1.5'
  - '@symbiote-native/splash-screen@0.1.3 || 2.0.0'
  - '@symbiote-native/navigation@1.0.0'
  - expo-modules-core@57.0.20
  - expo-modules-jsi@57.0.3
  - expo-sensors@57.0.2
  - expo-modules-autolinking@57.0.8
  - expo-local-authentication@57.0.2
  - expo-secure-store@57.0.1
  - expo-sharing@57.0.8
  - expo-web-browser@57.0.2
  - expo-sms@57.0.1
  - expo-haptics@57.0.1
  - expo-clipboard@57.0.1
  - expo-battery@57.0.1
  - expo-brightness@57.0.1
  - expo-cellular@57.0.1
  - expo-network@57.0.1
  - expo-device@57.0.1
  - expo-application@57.0.2
  - expo-crypto@57.0.1
  - expo-localization@57.0.1
  - expo-keep-awake@57.0.1
  - expo-screen-orientation@57.0.1
  - expo-tracking-transparency@57.0.1
  - expo-store-review@57.0.1
  - expo-system-ui@57.0.2
  - expo-linear-gradient@57.0.2
  - expo-blur@57.0.3
  - expo-glass-effect@57.0.4
  - expo-symbols@57.0.3
  - expo-apple-authentication@57.0.2
  - expo-live-photo@57.0.2
  - expo-camera@57.0.6
  - expo-video@57.0.5
  - expo-image@57.0.5
  - expo-gl@57.0.2

# Single source of truth for dependency versions (pnpm catalogs).
# A package references a version with `catalog:` (default) or `catalog:<name>`
# instead of a literal, so a bump happens HERE, in one place. The guard that
# nobody slips a literal version past this file is syncpack (`pnpm deps:check`).
#
# peerDependencies are deliberately NOT catalogued. External peers are compatibility
# ranges (`>=19.0.0`, `>=0.86`); internal @symbiote-native peers use `workspace:^`, which
# `pnpm pack` rewrites to a bounded caret range for the peer's current workspace version.
catalog:
  # framework runtimes — exactly one copy across the monorepo (the RN/react
  # singleton the `overrides` below also guards transitively)
  react: 19.2.3
  react-native: 0.86.0
  react-reconciler: ^0.33.0
  '@vue/runtime-core': ^3.5.13
  '@vue/compiler-sfc': ^3.5.13
  '@vue/compiler-core': ^3.5.13
  '@vue/babel-plugin-jsx': ^1.5.0
  vue: ^3.5.38
  vue-tsc: ^2.2.12
  # Pinned to 22.0.x: compiler-cli 22.1 needs Babel 8 (`assertVersion(8)`), Metro ships 7.29.7.
  # All four move in lock-step, unpin once RN ships a Babel 8 preset (angular-adapter skill)
  '@angular/core': ~22.0.8
  '@angular/common': ~22.0.8
  '@angular/compiler': ~22.0.8
  '@angular/compiler-cli': ~22.0.8
  # Same lock-step family as the four above, the same patch avoids a second source of version drift
  '@angular/forms': ~22.0.8
  # Measured against 5.56.8 in svelte-adapter-dom-shim (2026-08-10) — `fragments: 'tree'`
  # (mandatory, §2 of that skill) needs >=5.33. Confirmed a real published npm release:
  # `pnpm install` resolved this range to 5.56.8 (2026-08-11).
  svelte: ^5.56.0
  # Declaration emit for the raw `.svelte` sources we publish (scripts/emit-svelte-declarations.mjs).
  # Same library `svelte-package` uses for the job; it is also what `svelte-check` runs on internally,
  # so it moves with `svelte` above, not independently.
  svelte2tsx: ^0.7.61
  # Not 2.0 (RC as of 2026-08): it moves to `@solidjs/universal` and changes the renderer contract.
  # Moving means rewriting `adapters/solid/src/renderer.ts` (solid-adapter skill has the full diff)
  solid-js: ^1.9.14
  # Compiles our JSX into universal-renderer calls (`generate: 'universal'` + our `moduleName`).
  # Moves in lock-step with `solid-js` above — which functions the compiled output imports is a
  # private contract between the preset and the runtime, not a public API.
  babel-preset-solid: ^1.9.12
  # Runs that same compilation under Vite for the headless `solid` vitest project. Needed because
  # adapters/solid builds with `jsx: 'preserve'` (tsc leaves JSX untouched so the consuming app's
  # Babel compiles it), which leaves nothing to execute under Vitest without its own transform.
  vite-plugin-solid: ^2.11.14

  # type packages
  '@types/react': ^19.2.0
  '@types/react-reconciler': ^0.32.2
  '@types/jest': ^29.5.12
  '@types/node': ^26.0.0

  # workspace tooling (builds/lints/tests the library packages)
  '@changesets/cli': ^2.31.0
  '@changesets/changelog-github': ^1.0.0
  pkg-pr-new: ^0.0.75
  esbuild: 0.28.1
  typescript: ~6.0.0
  vitest: ^4.1.9
  eslint: ^10.6.0
  prettier: ^3.9.1
  # Root reads `examples/svelte/.prettierrc.js`; prettier loads its `plugins` for every covered file
  # Without it the format sweep cannot reach that tree's .ts files (it still excludes *.svelte)
  prettier-plugin-svelte: ^4.1.1
  # Same reason as the svelte plugin, for apps/docs-site's .astro pages: without it the
  # format sweep aborts with `No parser could be inferred` on the first one.
  prettier-plugin-astro: ^0.14.1
  '@eslint/js': ^10.0.1
  # Official Language Plugin for linting package.json as JSON (not TS/JS) — backs the
  # local require-readme / require-package-fields rules in eslint.config.js.
  '@eslint/json': ^2.0.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  # Lints adapters/svelte's and packages/*/src/svelte's .svelte source through eslint.config.js's
  # per-framework layer — bundles svelte-eslint-parser. Peers eslint ^10.0.0 / svelte ^5.0.0, both
  # already the catalog versions above.
  eslint-plugin-svelte: ^3.23.0
  typescript-eslint: ^8.62.0
  globals: ^17.7.0
  husky: ^9.1.7
  lint-staged: ^17.0.8
  syncpack: ^15.3.2

  # packages/cli's own CLI toolchain — mirrors create-vue's zero-runtime-deps
  # shape (bundled via rolldown at publish time, devDependencies only). See
  # packages/cli/README.md.
  '@clack/prompts': ^1.7.0
  picocolors: ^1.1.1
  rolldown: 1.2.0

  postcss: ^8.4.49
  postcss-value-parser: ^4.2.0
  # CSS-Modules renaming / `composes` / `:global()` for core/css-parser. MPL-2.0 while this repo
  # is MIT: depending on it is fine, vendoring or patching its sources is not.
  lightningcss: ^1.32.0
  # optional CSS preprocessors — devDependencies of core/css-parser ONLY, never a dependency of
  # that package or any consuming app
  sass: ^1.101.0
  less: ^4.6.7
  stylus: ^0.64.0
  '@types/less': ^3.0.8
  '@types/stylus': ^0.48.43

  # Documentation site toolchain — used only by apps/docs-site
  astro: ^7.0.3
  '@astrojs/starlight': ^0.41.1
  '@astrojs/check': ^0.9.9
  # Agent-facing docs surface: the llms.txt / llms-full.txt corpora. The per-page .md
  # twin and its actions row are local (src/pages, src/components/PageTitle.astro).
  starlight-llms-txt: ^0.12.0

  # Published @symbiote-native/* packages. examples/* left the pnpm workspace (2026-07) to
  # become standalone `npm install`-able apps free of pnpm's blockExoticSubdeps guard — its
  # package.json files now carry literal versions/pkg.pr.new URLs directly, not `catalog:`.
  # These entries remain for examples/angular's own css-parser dep and stay in lock-step
  # with each package's release train; internal cross-package deps between
  # core/adapters/packages stay workspace:* (see .syncpackrc.json).
  '@symbiote-native/react': latest
  '@symbiote-native/vue': latest
  '@symbiote-native/angular': latest
  '@symbiote-native/engine': latest
  '@symbiote-native/components': latest
  '@symbiote-native/css-parser': latest
  '@symbiote-native/slider': latest
  '@symbiote-native/splash-screen': latest
  '@symbiote-native/sensors': latest
  '@symbiote-native/test-utils': latest

  # React Native app toolchain — single-versioned. examples/* left the workspace (see above);
  # entries here stay for @react-native/metro-babel-transformer (a real dependency of
  # @symbiote-native/css-parser itself) and anything else the remaining workspace still needs.
  '@react-native/babel-preset': 0.86.0
  '@react-native/metro-config': 0.86.0
  # Real dependency of @symbiote-native/css-parser (createCssMetroTransformer resolves it itself),
  # not just examples/* — see core/css-parser/src/metro-transformer.ts.
  '@react-native/metro-babel-transformer': 0.86.0
  '@react-native/eslint-config': 0.86.0
  '@react-native/typescript-config': 0.86.0
  '@react-native/gradle-plugin': 0.86.0
  '@react-native/codegen': 0.86.0
  # A real runtime dependency of @symbiote-native/engine, not just tooling: animated/rgba.ts
  # decomposes colors through it instead of hand-rolling a parser that knew no named colors.
  # Versioned independently of the 0.86.0 family above - react-native 0.86.0 itself ships 0.86.2.
  '@react-native/normalize-colors': 0.86.2
  # `core/components` imports RN's list helpers from it instead of keeping hand copies
  '@react-native/virtualized-lists': 0.86.0
  '@react-native/new-app-screen': 0.86.0
  '@react-native-community/cli': 20.1.0
  '@react-native-community/cli-platform-android': 20.1.0
  '@react-native-community/cli-platform-ios': 20.1.0
  # Exact pins, same reason as `react-native-screens` below: a caret range lets a standalone
  # `examples/*` install drift its native side ahead of the vendored `codegen-specs/` snapshot
  '@react-native-community/slider': 5.2.0
  react-native-bootsplash: 7.3.2
  react-native-is-edge-to-edge: ^1.3.1
  # Exact pin: `@symbiote-native/navigation` vendors its codegen specs, so a newer consumer install
  # would use native types our snapshot never generated (rule `native-proxy-package-files`)
  react-native-screens: 4.26.0
  react-native-safe-area-context: ^5.5.2
  # Exact pins for every `expo-*` entry below: the package is used ONLY for its native folders.
  # Its JS is hand-ported into our own core, so a caret range could drift the two apart
  expo-sensors: 57.0.2
  expo-modules-core: 57.0.20
  # Same exact-pin reasoning as expo-sensors above: packages/local-auth depends on
  # expo-local-authentication only for its native ios/android folders (JS hand-ported into our
  # own core). Version verified against .vendors/expo at origin/sdk-57 — matches the version
  # already published to npm (57.0.2), same expo-modules-core 57.0.5 peer/runtime as sensors.
  expo-local-authentication: 57.0.2
  # Versions are the npm `latest` as of 2026-07-28, the `.vendors/expo` snapshot has an older 55.0.8
  expo-haptics: 57.0.1
  expo-clipboard: 57.0.1
  expo-battery: 57.0.1
  # Versions are the npm `latest` as of 2026-07-29
  expo-brightness: 57.0.1
  expo-cellular: 57.0.1
  expo-network: 57.0.1
  # Same exact-pin reasoning as the trio above: packages/application depends on expo-application
  # ONLY for its native ios/android folders (JS hand-ported into our own core). Version verified
  # against .vendors/expo at origin/sdk-57 (57.0.2) and matches the real npm-published `latest`
  # as of 2026-07-29 — no drift between the two.
  expo-application: 57.0.2
  # Same exact-pin reasoning as the trio above: packages/device depends on expo-device ONLY for
  # its native ios/android folders (JS hand-ported into our own core). Version verified against
  # .vendors/expo at origin/sdk-57 (57.0.1), same expo-modules-core 57.0.5 peer/runtime line.
  expo-device: 57.0.1
  # The hand-ported JS skips the `aes/` subfolder, out of scope for this pass
  expo-crypto: 57.0.1
  # Tier-1 of the `symbiote-expo-package-catalog` queue, versions verified at origin/sdk-57
  # `expo-standard-web-crypto` has no native folders, so it needs no entry
  expo-localization: 57.0.1
  expo-keep-awake: 57.0.1
  expo-screen-orientation: 57.0.1
  expo-tracking-transparency: 57.0.1
  expo-store-review: 57.0.1
  expo-system-ui: 57.0.2
  # packages/linear-gradient depends on expo-linear-gradient ONLY for its native ios/android
  # folders (JS hand-ported into our own core). Pinned to the version at origin/sdk-57
  expo-linear-gradient: 57.0.2
  # packages/blur depends on expo-blur ONLY for its native ios/android folders (JS hand-ported
  # into our own core). Pinned to the version at origin/sdk-57
  expo-blur: 57.0.3
  # packages/glass-effect takes expo-glass-effect for its native ios folder only
  expo-glass-effect: 57.0.4
  # packages/symbols takes expo-symbols for its native ios folder only
  expo-symbols: 57.0.3
  # packages/apple-authentication takes expo-apple-authentication for its native ios folder only
  expo-apple-authentication: 57.0.2
  # packages/live-photo takes expo-live-photo for its native ios folder only
  expo-live-photo: 57.0.2
  # packages/camera takes expo-camera for its native ios and android folders only
  expo-camera: 57.0.6
  # packages/video takes expo-video for its native ios and android folders only
  expo-video: 57.0.5
  # packages/image takes expo-image for its native ios and android folders only
  expo-image: 57.0.5
  # packages/gl takes expo-gl for its native ios and android folders only
  expo-gl: 57.0.2
  # The Android and web path of SymbolView renders Material Symbols from these, as upstream does
  '@expo-google-fonts/material-symbols': ^0.4.1
  sf-symbols-typescript: ^2.0.0
  # Same exact-pin reasoning again — first of tier-2: packages/secure-store depends on
  # expo-secure-store ONLY for its native ios/android folders (JS hand-ported into our own core).
  # Version verified against .vendors/expo at origin/sdk-57 (57.0.1) and matches the real
  # npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-secure-store: 57.0.1
  # Tier-2 versions are verified at origin/sdk-57 and against the npm `latest`
  expo-sharing: 57.0.8
  expo-web-browser: 57.0.2
  expo-sms: 57.0.1
  # Same exact-pin reasoning: packages/mail-composer depends on expo-mail-composer ONLY for its
  # native ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.2)
  # and matches the real npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-mail-composer: 57.0.2
  # Same exact-pin reasoning: packages/print depends on expo-print ONLY for its native
  # ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.2)
  # and matches the real npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-print: 57.0.2
  # Same exact-pin reasoning: packages/document-picker depends on expo-document-picker ONLY for
  # its native ios/android folders. Version verified against .vendors/expo at origin/sdk-57
  # (57.0.2) and matches the real npm-published `latest`, same expo-modules-core 57.0.5
  # peer/runtime line. The upstream config plugin (iCloud entitlements) is not carried over —
  # see packages/document-picker/README.md.
  expo-document-picker: 57.0.2
  # Same exact-pin reasoning: packages/image-picker depends on expo-image-picker ONLY for its
  # native ios/android folders. Version verified against .vendors/expo at origin/sdk-57
  # (57.0.20) and matches the real npm-published `latest`, same expo-modules-core 57.0.5
  # peer/runtime line.
  expo-image-picker: 57.0.20
  # Same exact-pin reasoning: packages/image-manipulator depends on expo-image-manipulator ONLY
  # for its native ios/android folders. Version verified against .vendors/expo at origin/sdk-57
  # (57.0.20) and matches the real npm-published `latest`, same expo-modules-core 57.0.5
  # peer/runtime line. The `extent` action is web-only (no native impl on either platform) — not
  # ported, see packages/image-manipulator/README.md.
  expo-image-manipulator: 57.0.20
  # Same exact-pin reasoning: packages/video-thumbnails depends on expo-video-thumbnails ONLY for
  # its native ios/android folders. Version verified against .vendors/expo at origin/sdk-57
  # (57.0.2) and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-video-thumbnails: 57.0.2
  # Android-only package, native folder only
  expo-intent-launcher: 57.0.1
  # Android-only package, native folder only
  expo-navigation-bar: 57.0.2
  # Same exact-pin reasoning: packages/blob depends on expo-blob ONLY for its native
  # ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.2)
  # and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-blob: 57.0.2
  # Same exact-pin reasoning: packages/speech depends on expo-speech ONLY for its native
  # ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.3)
  # and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-speech: 57.0.3
  # Same exact-pin reasoning: packages/screen-capture depends on expo-screen-capture ONLY for
  # its native ios/android folders. Version verified against .vendors/expo at origin/sdk-57
  # (57.0.3) and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-screen-capture: 57.0.3
  # Same exact-pin reasoning: packages/calendar depends on expo-calendar ONLY for its native
  # ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.5)
  # and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-calendar: 57.0.5
  # Same exact-pin reasoning: packages/contacts depends on expo-contacts ONLY for its native
  # ios/android folders. Version verified against .vendors/expo at origin/sdk-57 (57.0.6)
  # and npm-published `latest`, same expo-modules-core 57.0.5 peer/runtime line.
  expo-contacts: 57.0.6
  # `unimodules-app-loader` is a runtime dependency of `expo-task-manager`
  # Android's headless boot (`RNHeadlessAppLoader`) needs its native folder, so it is pinned too
  expo-task-manager: 57.0.15
  unimodules-app-loader: 57.0.1
  # packages/task-manager depends on expo-constants only for its native ConstantsService: legacy
  # TaskManagerInternalModule reads ConstantsInterface from AppContext's ServicesRegistry for
  # appScopeKey and throws (NPE) if nothing provides it. Safe standalone - its only real dep is
  # @expo/env, no metro-config/babel-preset-expo; matches npm latest and the expo-modules-core peer.
  expo-constants: 57.0.19
  # Pinned to 57.0.15, not the vendored 57.0.16: that one needs an unpublished
  # `expo-task-manager@~57.0.16`, so nothing in the workspace can install it
  expo-background-fetch: 57.0.15
  expo-background-task: 57.0.15
  # Its Android `build.gradle` also pulls `play-services-location` from Maven, Gradle resolves it
  expo-location: 57.0.15
  # The port covers the legacy function-based API only, the shared-object "Next" API is out of scope
  expo-media-library: 57.0.4
  # The port covers the legacy function-based API only
  # The shared-object `File`/`Directory`/`Paths` API is out of scope
  expo-file-system: 57.0.6
  # The port carries the shared-object `AudioPlayer` and `AudioRecorder` classes
  # It is sourced without the `expo-asset` peer
  expo-audio: 57.0.4
  # The port drops upstream's push-token auto-resync daemon, see the package README for the rest
  expo-notifications: 57.0.17
  # Its native classes are plain `requireNativeModule` constructors, no JSI shared objects
  # Its `peerDependencies` are all wildcards, so no unpublished-peer trap like background-fetch
  expo-sqlite: 57.0.2
  # The port drops the classic-updates and Expo Go branches
  expo-asset: 57.0.18
  # react-native's own dependency (its asset registry) — pinned as a direct dependency of
  # packages/asset for the same "explicit over transitive" reason as the invariant pin below.
  '@react-native/assets-registry': 0.86.0
  # Full `FontSource` parity comes via `packages/asset`
  expo-font: 57.0.4
  # Version matches the npm `latest`
  expo-age-range: 57.0.5
  # Same exact-pin reasoning: packages/app-integrity depends on @expo/app-integrity ONLY for its
  # native folders, version 57.0.2 matching npm-published `latest`. Scoped, unlike the rest of
  # this catalog - autolinking still derives Gradle project name `expo-app-integrity` from it
  '@expo/app-integrity': 57.0.2
  # Same exact-pin reasoning: packages/app-metrics depends on expo-app-metrics ONLY for its
  # native folders, version 57.0.21 matching npm-published `latest`. Its own real dependency
  # expo-updates-interface resolves transitively, no separate catalog entry needed for it
  expo-app-metrics: 57.0.21
  # Runtime dependency of `expo-sqlite` (its kv-store write lock), kept on the vendored version
  await-lock: ^2.2.2
  # Test-only: backs the headless fakes for expo-sqlite's native Database/Statement/Session
  # constructors in packages/sqlite's vitest suite (user's explicit choice over node:sqlite).
  # Never a runtime dependency of the shipped package.
  better-sqlite3: ^13.0.3
  # Autolinking CLI only (never resolved via the `expo` package) — each native host app needs
  # it as a direct devDependency so its Podfile/settings.gradle can `require.resolve` it; see
  # apps/docs-site's expo-native-module-setup howto. Version verified against .vendors/expo at
  # origin/sdk-57.
  expo-modules-autolinking: 57.0.8
  # Already installed via `react-native` (pins `^2.2.4`)
  # `packages/local-auth` uses it in `authenticateAsync`, so it is declared directly
  invariant: ^2.2.4
  '@types/invariant': ^2.2.37
  '@babel/core': ^7.25.2
  # The pair that lets Vitest read react-native's own Flow source (vitest.config.ts). The parser
  # swap is NOT optional: @babel/preset-flow is behind Flow's syntax and dies on the conditional
  # type in flattenStyle.js, so RN compiles itself with Hermes' parser and so do we.
  '@babel/plugin-transform-flow-strip-types': ^7.25.2
  'babel-plugin-syntax-hermes-parser': ^0.36.0
  '@types/babel__core': ^7.20.5
  '@babel/preset-env': ^7.25.3
  '@babel/runtime': ^7.25.0
  jest: ^29.7.0
  jest-circus: ^29.7.0
  ts-jest: ^29.4.11
  detox: ^20.51.4

catalogs:
  # eslint is the ONE dependency that cannot share the workspace version:
  # @react-native/eslint-config@0.86 peers `eslint ^8 || ^9` (never 10) and the
  # examples lint through legacy `.eslintrc.js`; eslint 10 no longer reads it
  # (flat-config only). Collapsing to eslint 10 needs both a flat-config rewrite
  # of every example AND an eslint-10-capable RN config upstream.
  # prettier and typescript ARE unified in the default catalog (typescript pinned
  # to `~6.0.0` — Angular 22's compiler peers `>=6.0 <6.1`, and typescript-eslint
  # peers `<6.1.0`, so the tilde range keeps every consumer inside both ceilings).
  # RN's config peers `prettier >=2`, so prettier 3 is fine.
  rn-app:
    eslint: ^8.19.0

overrides:
  # One react copy across the monorepo (matches the canary pin) so the adapter's
  # reconciler and app elements/hooks share one instance — otherwise Vitest hits
  # "Invalid hook call". `catalog:` keeps this in lock-step with catalog.react.
  # The catalog handles direct declarations; this override handles transitive
  # react pulled in by any nested dependency.
  react: 'catalog:'
