name: Checks

# Reusable workflow (workflow_call only — never triggers on its own). Both
# ci.yml (fast PR feedback) and release.yml (hard gate before publish) call
# this so the job definitions live in one place; cross-workflow `needs:`
# doesn't exist in GitHub Actions, calling a shared workflow is the way to
# avoid re-defining the same three jobs twice.
on:
  workflow_call:

jobs:
  # This exact tree may already have been verified — a push to master re-runs every check on a
  # merge/squash/rebase commit whose CONTENT was already checked on the PR it came from, just under
  # a different SHA (all three merge strategies mint a new commit). Keying a cache on the TREE
  # object (`git rev-parse HEAD^{tree}`) survives that: it is identical whenever the file contents
  # are, whatever the commit SHA says, and any real change misses the cache and runs everything —
  # so a hit can only ever skip work that is provably redundant, never real verification.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.hash }}
      cache-hit: ${{ steps.restore.outputs.cache-hit }}
      bundle-tree: ${{ steps.bundle-tree.outputs.hash }}
      bundle-cache-hit: ${{ steps.restore-bundle.outputs.cache-hit }}
      bundle-arms: ${{ steps.arms.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # lookup-only: checks whether the key exists without downloading anything — there is no
      # content to restore, the key's existence IS the answer.
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: .checks-passed
          key: checks-passed-${{ steps.tree.outputs.hash }}
          lookup-only: true

      # The SAME mechanism narrowed to what a packed consumer bundle can possibly depend on: a
      # second tree hash over every path EXCEPT prose. 47 of the last 120 non-merge commits here
      # touched nothing else, and each one paid the full 10-12 minute matrix to re-verify bytes it
      # could not reach. A `paths-ignore:` on the workflow trigger is the obvious spelling and is
      # WRONG — `Checks / Lint`, `/ Typecheck` and `/ Test` are required status contexts on master,
      # and a workflow that does not run never reports them, so a docs-only PR would sit forever on
      # "Expected — waiting for status". Gating the one expensive JOB keeps the cheap three running.
      #
      # It is also strictly more accurate than a diff filter: this asks whether this exact bundle-
      # relevant CONTENT has passed before, not whether the last push happened to be prose. A docs
      # commit on top of unverified code still misses.
      #
      # The exclusions are a DENY-list, like `scripts/lib/canary-examples.mjs`'s — do not invert it.
      # A new source directory is covered the day it exists; an allow-list would silently drop it.
      - id: bundle-tree
        run: |
          hash=$(git ls-tree -r HEAD \
            | grep -Ev $'\t''(.*/)?[^/]*\.md$|'$'\t''\.(docs|claude|notes|vendors)/' \
            | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - id: restore-bundle
        uses: actions/cache/restore@v4
        with:
          path: .bundle-isolation-passed
          key: bundle-isolation-passed-${{ steps.bundle-tree.outputs.hash }}
          lookup-only: true

      # READ FROM THE SCRIPT, never written down here. `examples/vue-tsx` spent a year in no CI list
      # at all because one was hand-maintained (`scripts/lib/canary-examples.mjs` carries the full
      # record), and a matrix is exactly the shape that invites a second copy of the arm names.
      # `selectedValues` validates what it is handed, so a stale name fails loudly rather than
      # quietly shrinking coverage. No install needed: `main()` is guarded and the import chain is
      # node builtins only.
      - id: arms
        run: |
          list=$(node -e "import('./scripts/check-packed-consumer-bundles.mjs').then(m => console.log(JSON.stringify(Object.keys(m.FRAMEWORK_EXAMPLES))))")
          echo "list=$list" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: gate
    if: needs.gate.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: gate
    if: needs.gate.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

  test:
    name: Test
    needs: gate
    if: needs.gate.outputs.cache-hit != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test

  # ONE RUNNER PER ARM. The script has always run its arms concurrently, but six `npm install`s of
  # the RN toolchain plus twelve Metro production bundles shared two vCPUs, so "concurrent" cost
  # 10-12 minutes of wall clock. A real matrix turns that into the slowest single arm (angular, which
  # pays `ng:build`), and per-arm packing is narrower too: `packageNames` is derived from the
  # SELECTED manifests, so each runner packs only what its own example declares.
  bundle-isolation:
    name: Packed consumer bundle matrix
    needs: gate
    if: >
      needs.gate.outputs.cache-hit != 'true' &&
      needs.gate.outputs.bundle-cache-hit != 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every arm's verdict is wanted, not just the first failure — one framework's broken tarball
      # says nothing about the other five, and cancelling them costs a whole second run to find out.
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.gate.outputs.bundle-arms) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first because every tarball's publishConfig points at build/ (and build-ngc/ for
      # Angular). This arm then packs the direct @symbiote-native dependencies of its own standalone
      # canary example, installs them into a disposable npm consumer, type-checks/AOT-builds the app,
      # and creates iOS + Android Metro production bundles. One arm per example, not per adapter —
      # vue-sfc and vue-tsx both consume @symbiote-native/vue.
      - run: pnpm run prepublish-build

      # Dependency cache, not build-output cache (build output is per-run by design — the whole
      # point of this matrix is a FRESH tarball install every time). Keyed per ARM now that each one
      # owns its runner: a shared key would have every arm racing to save a cache holding only its
      # own framework's downloads. `npmCacheDirFor`'s per-framework isolation under this root stays
      # as it is — it guards the same-process case the script still supports locally. Without this,
      # an arm re-downloads the entire RN toolchain from the registry on every run; measured
      # 2026-09-14 install dominates each framework's 300s+ wall time. Keyed on the example
      # manifests since that's what pins the installed versions (no lockfile survives — see
      # rewriteInternalDependencies).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-consumer-cache
          key: npm-consumer-cache-${{ matrix.arm }}-${{ hashFiles('examples/*/package.json') }}
          restore-keys: |
            npm-consumer-cache-${{ matrix.arm }}-

      - run: pnpm run check:bundle-isolation
        env:
          SYMBIOTE_CONSUMER_FRAMEWORKS: ${{ matrix.arm }}
          SYMBIOTE_NPM_CACHE_ROOT: ${{ runner.temp }}/npm-consumer-cache

  # Records that this tree passed, so the NEXT push/PR carrying the identical tree (a merge/squash/
  # rebase commit is the common case) hits the gate above instead of re-running everything. Only
  # runs when this job's own trigger actually did the work (cache-hit != 'true') and every check
  # succeeded — `always()` is needed because a skipped or failed dependency must still let this job
  # EVALUATE its condition rather than being skipped itself by the implicit success() default.
  #
  # A matrix job's `result` aggregates its legs — `success` only when every arm succeeded — so this
  # condition did not have to change for the matrix. It DID have to admit `skipped`: the arms are
  # now also gated on the bundle-tree cache, and a prose-only commit legitimately skips them. Naming
  # both states is what keeps a docs commit from re-running lint/typecheck/test forever after.
  mark-passed:
    name: Mark tree as passed
    needs: [gate, lint, typecheck, test, bundle-isolation]
    if: >
      always() &&
      needs.gate.outputs.cache-hit != 'true' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      (needs['bundle-isolation'].result == 'success' ||
      needs['bundle-isolation'].result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p .checks-passed && date -u > .checks-passed/verified-at

      - uses: actions/cache/save@v4
        with:
          path: .checks-passed
          key: checks-passed-${{ needs.gate.outputs.tree }}

  # The bundle matrix's own record, keyed on the narrowed hash. Deliberately NOT folded into
  # `mark-passed`: that one says "this whole tree is verified" and must not be written when the
  # arms were skipped, while this one says "this bundle-relevant content is verified" and is the
  # only thing a later prose-only commit can inherit. One key per claim.
  mark-bundle-passed:
    name: Mark bundle tree as passed
    needs: [gate, bundle-isolation]
    if: >
      always() &&
      needs.gate.outputs.bundle-cache-hit != 'true' &&
      needs['bundle-isolation'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p .bundle-isolation-passed && date -u > .bundle-isolation-passed/verified-at

      - uses: actions/cache/save@v4
        with:
          path: .bundle-isolation-passed
          key: bundle-isolation-passed-${{ needs.gate.outputs.bundle-tree }}
