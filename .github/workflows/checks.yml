name: Checks

# Reusable workflow (workflow_call only — never triggers on its own). Both
# ci.yml (fast PR feedback) and release.yml (hard gate before publish) call
# this so the job definitions live in one place; cross-workflow `needs:`
# doesn't exist in GitHub Actions, calling a shared workflow is the way to
# avoid re-defining the same three jobs twice.
on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test

  bundle-isolation:
    name: Bundle framework isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Needed before `pnpm pack` can produce a real tarball: publishConfig points every
      # exports entry at build/ (and build-ngc/ for Angular), so packing straight from a
      # fresh checkout with no build/ ships an empty package.
      - run: pnpm run prepublish-build

      # examples/* live OUTSIDE the pnpm workspace on purpose (<examples_vs_dot_examples>,
      # CLAUDE.md) — a real `npm install`, not `pnpm install -w`, matching what an actual
      # npm consumer runs.
      - name: Install example dependencies
        run: |
          for dir in examples/react examples/vue-sfc examples/svelte examples/angular; do
            echo "::group::npm install ($dir)"
            (cd "$dir" && npm install)
            echo "::endgroup::"
          done

      # Overlays this commit's freshly built packages/* into each example's node_modules,
      # in place of whatever version its package.json pins from the npm registry — the
      # check below is worthless if it validates last month's published slider/navigation,
      # not the change actually under review.
      - run: pnpm run overlay-local-packages

      - run: pnpm run check:bundle-isolation
