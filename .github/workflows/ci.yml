name: CI

on:
  # develop is a real PR base in this repo (roughly half of past PRs target
  # it, not just master) — branches:[master]-only silently gave zero CI to
  # every one of them; this filter matches the PR's BASE ref, so widening it
  # here is the actual fix, not a workaround in publish-canary/workflow_run.
  pull_request:
    branches: [master, develop]
  # master is deliberately excluded: release.yml's own `checks` job already
  # runs checks.yml on every push to master. Including master here duplicated
  # the entire suite (incl. the ~8min bundle-isolation matrix) on every merge
  # into master, racing both runs against the same tree-hash cache key.
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
