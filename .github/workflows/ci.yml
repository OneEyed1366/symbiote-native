name: CI

on:
  # develop is a real PR base in this repo (roughly half of past PRs target
  # it, not just master) — branches:[master]-only silently gave zero CI to
  # every one of them; this filter matches the PR's BASE ref, so widening it
  # here is the actual fix, not a workaround in publish-canary/workflow_run.
  pull_request:
    branches: [master, develop]
  # master is deliberately excluded: release.yml's own `checks` job already
  # runs checks.yml on every push to master. Including master here duplicated
  # the entire suite (incl. the bundle-isolation matrix) on every merge into
  # master, racing both runs against the same tree-hash cache key.
  push:
    branches: [develop]

  # NO `paths-ignore:` HERE, and it is not an oversight. `Checks / Lint`,
  # `/ Typecheck` and `/ Test` are required status contexts on master; a
  # workflow that does not run never reports them, so a prose-only PR would
  # sit forever on "Expected — waiting for status". The expensive job skips
  # itself instead, on its own content hash — see checks.yml's `gate`.

# The group stays; `cancel-in-progress` does not. This workflow has no job of its own to cancel,
# and a caller's concurrency does not govern a called workflow's jobs — so that `true` cancelled
# nothing, while reading it as proof the repo already superseded stale runs cost three months of
# cancelling them by hand. The one that works is in checks.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
